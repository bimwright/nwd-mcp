name: build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# A new push to a PR cancels its older run; master runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A PR that changes only Markdown or docs/ skips the heavy jobs below; master pushes always run everything.
  # Unit tests and the public-tree check still run, because some tests read the docs.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}")
          if echo "$changed" | grep -qvE '(\.md$|^docs/)'; then code=true; else code=false; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code changed: $code"

  server-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore src/NwdMcp.sln
      - name: Build + test (the test project pulls in the server transitively)
        run: dotnet test tests/Bimwright.Nwd.Tests/Bimwright.Nwd.Tests.csproj -c Release
      # Plug-in *shape* (net48, NAVIS20YY, API reference package, ...) is verified by the xUnit
      # PluginProjectFileTests; the plug-ins themselves build in the plugin-builds job below.

  plugin-builds:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Every Navisworks year compiles against its own Autodesk API reference assemblies from NuGet
    # (Speckle.Navisworks.API, compile-time only), so no Navisworks install is needed here.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        year: [ 22, 23, 24, 25, 26, 27 ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Navisworks 20${{ matrix.year }} plug-in
        run: dotnet build src/plugin-navis${{ matrix.year }}/Bimwright.Nwd.Plugin.Navis${{ matrix.year }}.csproj -c Release
      - name: No Autodesk binaries in the output
        shell: pwsh
        run: |
          $leaked = Get-ChildItem "src/plugin-navis${{ matrix.year }}/bin/Release/net48" -File |
            Where-Object { $_.Name -match '^(Autodesk\.Navisworks\.|AdWindows\.|navisworks\.)' }
          if ($leaked) { $leaked.Name; throw "Autodesk binaries reached the plug-in output." }

  installer:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # install.ps1 / uninstall.ps1 in disposable APPDATA/LOCALAPPDATA folders,
    # under Windows PowerShell 5.1 and PowerShell 7.
    name: installer-${{ matrix.shell }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [ powershell, pwsh ]
    steps:
      - uses: actions/checkout@v4
      - name: Test isolated install, upgrade and uninstall
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          & ${{ matrix.shell }} -NoProfile -ExecutionPolicy Bypass -File ./tests/installer/install.Tests.ps1 -ResultPath artifacts/installer-${{ matrix.shell }}.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-${{ matrix.shell }}
          path: artifacts/installer-*.json

  # The one required check for master: green when every job passed or was skipped for a docs-only PR.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, server-tests, plugin-builds, installer]
    runs-on: ubuntu-latest
    steps:
      - name: Fail when any job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
      - name: All jobs passed or were skipped
        run: echo ok
